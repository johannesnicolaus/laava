name: map_reads
description: Map reads to reference sequences using minimap2
keywords:
  - alignment
  - map
  - bam
  - reads
  - minimap2
tools:
  - minimap2:
      description: A versatile pairwise aligner for genomic and spliced nucleotide sequences
      homepage: https://github.com/lh3/minimap2
      documentation: https://minimap2.readthedocs.io/
      licence: ["MIT"]
  - samtools:
      description: Tools for manipulating next-generation sequencing data
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - reads:
      type: file
      description: Input reads in FASTQ or BAM format
      pattern: "*.{fastq,fq,fastq.gz,fq.gz,bam}"
  - vector_fa:
      type: file
      description: Vector reference FASTA file
      pattern: "*.{fa,fasta}"
  - packaging_fa:
      type: file
      description: Packaging reference FASTA file (optional)
      pattern: "*.{fa,fasta}"
  - host_fa:
      type: file
      description: Host reference FASTA file (optional)
      pattern: "*.{fa,fasta}"
  - repcap_name:
      type: string
      description: Rep/Cap gene name
  - helper_name:
      type: string
      description: Helper gene name
  - lambda_name:
      type: string
      description: Lambda gene name

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - mapped_name_bam:
      type: file
      description: BAM file sorted by read name and reference names TSV
      pattern: "*.{bam,tsv}"
  - mapped_pos_bam:
      type: file
      description: BAM file sorted by position with index
      pattern: "*.{bam,bai}"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@formbio"
